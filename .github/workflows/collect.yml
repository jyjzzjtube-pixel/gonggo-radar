name: 공고 수집 및 배포

on:
  schedule:
    # KST 07:00 / 13:00 / 19:00 (UTC 22:00 / 04:00 / 10:00)
    - cron: "0 22,4,10 * * *"
  workflow_dispatch:      # 버튼으로 수동 즉시 수집
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        run: pip install requests beautifulsoup4

      - name: LH·SH·GH 수집 및 정적 빌드
        run: python build_static.py 3
        env:
          # 공공데이터포털 LH OpenAPI 키. 없으면 자동으로 웹 파싱으로 폴백한다.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}

      - name: 회귀검사 (실패 시 배포 중단)
        run: node test_regression.js

      - name: 수집 결과 요약
        run: |
          python - <<'EOF'
          import json
          d = json.load(open('dist/data.json', encoding='utf-8'))
          print('수집 %d건 / 빌드 %s' % (d['count'], d['built']))
          print('오류:', d['errors'] or '없음')
          bad = [i for i in d['items'] if not (i['u'] or '').startswith('http')]
          print('링크 불량:', len(bad))
          EOF

      # GitHub은 저장소가 60일간 조용하면 예약 워크플로를 자동으로 끈다.
      # 수집 기록을 커밋해 활동을 남겨두면 cron이 계속 살아있다.
      - name: 수집 기록 커밋 (예약 워크플로 자동정지 방지)
        run: |
          mkdir -p logs
          BUILT=$(python -c "import json;print(json.load(open('dist/data.json',encoding='utf-8'))['built'])")
          CNT=$(python -c "import json;print(json.load(open('dist/data.json',encoding='utf-8'))['count'])")
          ERRN=$(python -c "import json;print(len(json.load(open('dist/data.json',encoding='utf-8')).get('errors') or []))")
          STALE=$(python -c "import json;d=json.load(open('dist/data.json',encoding='utf-8'));print(','.join((d.get('stale') or {}).keys()) or '없음')")
          echo "$BUILT | ${CNT}건 | 오류 ${ERRN} | 갱신지연 ${STALE}" >> logs/collect_history.md
          tail -n 400 logs/collect_history.md > logs/history.tmp
          mv logs/history.tmp logs/collect_history.md
          git config user.name "gonggo-radar-bot"
          git config user.email "actions@github.com"
          git add logs/collect_history.md
          git commit -m "수집 기록 ${BUILT}" || echo "변경 없음 - 커밋 생략"
          git push || echo "push 생략"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
