<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2f8">
<title>공공공고 레이더</title>
<link rel="manifest" href="manifest.json">
<script src="eligibility.js"></script>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  /* 밝은 배경 + 높은 대비. 본문 대비 12:1 이상을 목표로 잡았다. */
  --bg:#eef2f8;            /* 페이지 바닥 */
  --bg2:#e2eaf5;           /* 그라데이션 아래쪽 */
  --panel:#ffffff;         /* 카드 */
  --panel2:#f2f6fc;        /* 보조 영역(칩·셀렉트) */
  --line:#cfdae9;          /* 구분선 */
  --line2:#e6edf6;         /* 옅은 구분선 */
  --tx:#121c2b;            /* 본문 */
  --tx2:#41536b;           /* 보조 */
  --tx3:#556681;           /* 약함 */
  --acc:#1d4ed8; --acc2:#1e40af;
  --hot:#c81e1e; --warn:#a55a00; --ok:#137a3c;
  --lh:#0369a1; --sh:#7e22ce; --gh:#0f766e;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --shadow:0 1px 2px rgba(18,28,43,.06),0 4px 14px rgba(18,28,43,.08);
  --shadow-lg:0 6px 28px rgba(18,28,43,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--tx);
  font:15.5px/1.6 -apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
  padding-bottom:calc(70px + var(--safe-b));
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}

header{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,#ffffff 0%,#e9f0fc 100%);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 10px rgba(18,28,43,.07);
  padding:calc(11px + var(--safe-t)) 15px 11px;
}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:18px;font-weight:800;letter-spacing:-.4px;flex:1;color:var(--tx)}
.hrow h1 i{font-style:normal;background:linear-gradient(135deg,#1d4ed8,#0f766e);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.built{font-size:12px;color:var(--tx2);margin-top:4px;font-weight:500}
.built b{color:var(--ok)}
.iconbtn{background:linear-gradient(180deg,#ffffff,#edf3fb);
  border:1px solid var(--line);color:var(--tx2);
  width:44px;height:44px;border-radius:12px;font-size:17px;
  display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn:active{background:var(--acc);color:#fff;border-color:var(--acc)}

.tabs{display:flex;gap:7px;overflow-x:auto;padding:12px 15px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:11px 16px;min-height:44px;display:flex;align-items:center;
  border-radius:999px;border:1px solid var(--line);
  background:linear-gradient(180deg,#ffffff,#f1f5fc);
  color:var(--tx2);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  box-shadow:0 1px 2px rgba(18,28,43,.05)}
.tab.on{background:linear-gradient(135deg,#1d4ed8,#2563eb);
  border-color:#1d4ed8;color:#fff;font-weight:700;
  box-shadow:0 3px 10px rgba(29,78,216,.32)}

.bar{display:flex;align-items:center;gap:9px;padding:12px 15px 6px;font-size:13px;color:var(--tx2)}
.bar b{color:var(--tx);font-size:17px;font-weight:800}
.bar .sp{flex:1}
.sel{background:linear-gradient(180deg,#ffffff,#f1f5fc);
  border:1px solid var(--line);color:var(--tx);
  border-radius:10px;padding:11px 9px;min-height:44px;
  font:inherit;font-size:13px;font-weight:600;box-shadow:var(--shadow)}

.list{padding:8px 12px}
.card{background:var(--panel);border:1px solid var(--line2);
  border-left:5px solid var(--line);
  border-radius:14px;padding:14px 15px;margin-bottom:11px;display:block;
  box-shadow:var(--shadow)}
.card:active{background:#f7faff;box-shadow:var(--shadow-lg)}
.card.LH{border-left-color:var(--lh)}
.card.SH{border-left-color:var(--sh)}
.card.GH{border-left-color:var(--gh)}
.top{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.ag{font-size:11.5px;font-weight:800;color:#fff;padding:3px 9px;border-radius:6px;letter-spacing:.3px}
.ag.LH{background:linear-gradient(135deg,#0369a1,#0284c7)}
.ag.SH{background:linear-gradient(135deg,#7e22ce,#9333ea)}
.ag.GH{background:linear-gradient(135deg,#0f766e,#0d9488)}
.sc{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:6px;border:1px solid}
.sc.a{color:#0b5c2e;border-color:#93d6ad;background:linear-gradient(135deg,#e6f7ed,#d3f0e0)}
.sc.b{color:#46590a;border-color:#c9dd7f;background:linear-gradient(135deg,#f3f9e0,#e8f2c6)}
.sc.c{color:#8a4a00;border-color:#eec98a;background:linear-gradient(135deg,#fdf3e2,#fbe7c8)}
.sc.d{color:var(--tx3);border-color:var(--line);background:var(--panel2)}
.vd{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:6px;border:1px solid}
.vd.ok{color:#0b5c2e;border-color:#8ad2a7;background:linear-gradient(135deg,#e4f7ec,#cdedd8)}
.vd.maybe{color:#8a4a00;border-color:#eec98a;background:linear-gradient(135deg,#fdf3e2,#fbe5c4)}
.vd.no{color:#9b1414;border-color:#f0adad;background:linear-gradient(135deg,#fdeaea,#fad7d7)}
.vd.unknown{color:var(--tx2);border-color:var(--line);background:var(--panel2)}
.new{font-size:10.5px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#c81e1e,#e02424);padding:3px 7px;border-radius:6px}
.dd{margin-left:auto;font-size:14px;font-weight:800}
.dd.hot{color:var(--hot)}.dd.warn{color:var(--warn)}
.dd.ok{color:#33465e}.dd.na{color:var(--tx3);font-size:12px;font-weight:600}
.ttl{font-size:15.5px;font-weight:700;line-height:1.5;margin-bottom:9px;word-break:keep-all;color:var(--tx)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tg{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;
    background:var(--panel2);border:1px solid var(--line);color:var(--tx2)}
.tg.rg{color:var(--acc2);border-color:#b4c9f2;background:linear-gradient(135deg,#eaf1fe,#dbe6fc)}
.tg.ql{color:#9b1414;border-color:#f0bcbc;background:linear-gradient(135deg,#fdeeee,#fbdfdf)}
.why{font-size:12px;color:var(--tx2);line-height:1.65}
.dts{font-size:12px;color:var(--tx3);margin-top:8px;display:flex;gap:14px;
     padding-top:8px;border-top:1px dashed var(--line2);font-weight:500}
.empty{text-align:center;color:var(--tx2);padding:60px 20px;font-size:14px;line-height:1.9}

.sheet{position:fixed;inset:0;background:rgba(18,28,43,.42);z-index:50;display:none;
       backdrop-filter:blur(2px)}
.sheet.on{display:block}
.sheetin{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;
  background:linear-gradient(180deg,#ffffff 0%,#f5f9ff 100%);
  border-radius:20px 20px 0 0;padding:20px 16px calc(24px + var(--safe-b));
  border-top:1px solid var(--line);box-shadow:0 -8px 32px rgba(18,28,43,.22)}
.sheetin h2{font-size:18px;font-weight:800;margin-bottom:5px;color:var(--tx)}
.sheetin p.sub{font-size:12.5px;color:var(--tx2);margin-bottom:18px;line-height:1.65}
.sheetin h4{font-size:12px;letter-spacing:.3px;color:var(--tx2);margin:18px 0 9px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:linear-gradient(180deg,#ffffff,#f1f5fc);
  color:var(--tx2);border-radius:10px;padding:12px 14px;min-height:44px;
  display:flex;align-items:center;font-size:13.5px;font-weight:600;
  cursor:pointer;user-select:none;box-shadow:0 1px 2px rgba(18,28,43,.05)}
.chip.on{background:linear-gradient(135deg,#1d4ed8,#2563eb);border-color:#1d4ed8;
  color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(29,78,216,.3)}
.btn{width:100%;background:linear-gradient(135deg,#1d4ed8,#2563eb);border:0;color:#fff;
  font:inherit;font-weight:800;font-size:16px;padding:15px;border-radius:13px;
  margin-top:22px;cursor:pointer;box-shadow:0 4px 14px rgba(29,78,216,.32)}
.btn.gh{background:linear-gradient(180deg,#ffffff,#edf3fb);border:1px solid var(--line);
  color:var(--tx2);margin-top:10px;box-shadow:var(--shadow)}
.regrow{display:flex;gap:8px;margin-bottom:8px}
.regrow input,.num{background:#fff;border:1px solid var(--line);color:var(--tx);
  border-radius:10px;padding:12px 12px;min-height:44px;font:inherit;font-size:14px;
  box-shadow:inset 0 1px 2px rgba(18,28,43,.05)}
.regrow input{flex:1}
.num{width:100%}
.regrow input:focus,.num:focus{outline:none;border-color:var(--acc);
  box-shadow:0 0 0 3px rgba(29,78,216,.16)}

.warnbox{background:linear-gradient(135deg,#fff8e6,#fdefcc);
  border:1px solid #e6c169;color:#7a4d00;border-radius:12px;
  padding:12px 14px;font-size:12.5px;line-height:1.7;margin:0 12px 10px;
  font-weight:500;box-shadow:0 1px 3px rgba(122,77,0,.08)}
.warnbox b{color:#5c3a00}

.install{display:none;align-items:center;gap:12px;margin:12px 12px 0;padding:14px 15px;
  background:linear-gradient(135deg,#e8f0fe 0%,#d9e5fd 100%);
  border:1px solid #a4c0f4;border-radius:14px;box-shadow:0 2px 10px rgba(29,78,216,.12)}
.install.on{display:flex}
.install .ic{width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,#1d4ed8,#2563eb);display:grid;place-items:center;
  font-size:20px;flex:none;box-shadow:0 3px 9px rgba(29,78,216,.3)}
.install .tx{flex:1;min-width:0}
.install .tx b{display:block;font-size:14.5px;font-weight:800;color:var(--tx)}
.install .tx span{font-size:12px;color:#2c4a86;line-height:1.55;font-weight:500}
.install button{background:linear-gradient(135deg,#1d4ed8,#2563eb);border:0;color:#fff;
  font:inherit;font-weight:800;font-size:13.5px;padding:13px 17px;min-height:44px;
  border-radius:11px;flex:none;cursor:pointer;box-shadow:0 3px 10px rgba(29,78,216,.3)}
.install .x{background:transparent;color:#4d6ea6;font-size:18px;padding:4px 6px;
  font-weight:500;box-shadow:none;min-height:44px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>공공공고 <i>레이더</i></h1>
    <button class="iconbtn" id="btnReload" title="새로고침">&#8635;</button>
    <button class="iconbtn" id="btnPref" title="내 조건">&#9881;</button>
  </div>
  <div class="built" id="built">불러오는 중…</div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="install" id="install">
  <div class="ic">📡</div>
  <div class="tx"><b id="insTtl">앱으로 설치하기</b><span id="insSub">홈 화면에 추가하면 앱처럼 바로 열립니다</span></div>
  <button id="insBtn">설치</button>
  <button class="x" id="insX">✕</button>
</div>

<div class="warnbox" id="warnbox"></div>

<div class="bar">
  <span><b id="cnt">0</b>건</span>
  <span class="sp"></span>
  <select class="sel" id="days">
    <option value="30">최근 1개월</option>
    <option value="90" selected>최근 3개월</option>
    <option value="180">최근 6개월</option>
    <option value="0">전체</option>
  </select>
  <select class="sel" id="minsc">
    <option value="0">전체 표시</option>
    <option value="40" selected>적합 40+</option>
    <option value="60">적합 60+</option>
    <option value="80">적합 80+</option>
  </select>
</div>

<div class="list" id="list"></div>

<!-- 조건 설정 -->
<div class="sheet" id="sheet">
  <div class="sheetin">
    <h2>내 조건</h2>
    <p class="sub">이 조건은 이 기기에만 저장됩니다(서버 전송 없음). 조건에 맞을수록 위로 올라옵니다.</p>

    <h4>희망 지역 — 시군구</h4>
    <div class="regrow"><input id="regIn" placeholder="예: 구리, 남양주, 중랑"><button class="iconbtn" id="regAdd">+</button></div>
    <div class="chips" id="pRegions"></div>

    <h4>월 소득 (부부합산, 만원)</h4>
    <input class="num" id="pIncome" type="number" inputmode="numeric" placeholder="예: 1000">
    <h4>맞벌이 여부</h4><div class="chips" id="pDual"></div>
    <h4>가구원수</h4><div class="chips" id="pHouse"></div>
    <h4>최소 전용면적 (㎡)</h4>
    <input class="num" id="pArea" type="number" inputmode="numeric" placeholder="예: 59">

    <h4>거래 유형</h4><div class="chips" id="pDeals"></div>
    <h4>자격 (해당되는 것)</h4><div class="chips" id="pQuals"></div>
    <h4>기관</h4><div class="chips" id="pAgency"></div>

    <button class="btn" id="btnSave">저장</button>
    <button class="btn gh" id="btnClose">닫기</button>
  </div>
</div>

<script>
const DEALS=["임대(전세)","임대(월세)","매매(분양·매각)","상가·업무","토지","기타"];
const QUALS=["신혼·신생아","청년","다자녀","고령자","장애인","저소득","일반"];
const AGENCIES=["LH","SH","GH"];
const SIDO_OF={"구리":"경기","남양주":"경기","의정부":"경기","중랑":"서울","광진":"서울",
  "동대문":"서울","노원":"서울","성남":"경기","수원":"경기","하남":"경기","고양":"경기","용인":"경기"};

// 기본 조건 (첫 실행 시)
const DEF={
  regions:["구리","남양주","의정부","중랑","광진","동대문","노원"],
  deals:["임대(전세)","임대(월세)","매매(분양·매각)"],
  quals:["신혼·신생아","청년","일반"],
  agency:[],
  income:4000000,    // 아내분 단독 월소득 (신청 명의 = 아내)
  dual:false,        // 1인가구 단독 신청
  household:1,
  minArea:59,
  liveSido:"경기",   // 현재 거주 시도 (구리시)
  hideNo:true        // 소득 초과 건 숨김
};
let P = JSON.parse(localStorage.getItem('radar_pref')||'null') || structuredClone(DEF);
let DATA=null, TAB='추천';
var lastFetch=0;
const LASTSEEN = localStorage.getItem('radar_seen')||'';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function dday(d){ if(!d) return null;
  const t=new Date(d+'T00:00:00'), n=new Date(); n.setHours(0,0,0,0);
  return Math.round((t-n)/864e5); }

// 서버(store.py match_score)와 동일한 규칙
// allowDeal: 특정 거래유형 탭을 직접 열었을 때는 그 유형을 제외대상으로 감점하지 않는다
function score(r, allowDeal){
  let s=0, why=[];
  const gu=r.gu||'', sd=r.sd||'';
  if(P.regions.length){
    const wantSido=[...new Set(P.regions.map(g=>SIDO_OF[g]).filter(Boolean))];
    const exact=P.regions.some(g=>g&&gu.includes(g));
    const sidoOk=wantSido.includes(sd);
    if(exact){ s+=45; why.push(`희망 시군구 일치(${sd} ${gu})`); }
    else if(sidoOk&&!gu){ s+=22; why.push(`희망 시도 일치·시군구 미상(${sd})`); }
    else if(sidoOk&&gu){ s+=6; why.push(`희망 시도지만 타 시군구(${sd} ${gu})`); }
    else if(sd==='전국'||!sd){ s+=8; why.push('전국/지역미상'); }
    else { s-=20; why.push(`희망지역 밖(${sd} ${gu})`); }
  } else s+=20;

  if(!P.deals.length||P.deals.includes(r.dl)||allowDeal===r.dl){ s+=20; why.push(`거래유형 ${r.dl}`); }
  else { s-=40; why.push(`※제외대상(${r.dl})`); }

  const hit=(r.q||[]).filter(q=>P.quals.includes(q));
  if(hit.length){ s+= hit.some(h=>h!=='일반')?20:10; why.push('자격 '+hit.join('/')); }

  if(r.k==='결과발표'){ s-=25; why.push('※결과발표'); }
  else if(r.k==='모집공고'){ s+=10; why.push('모집공고'); }

  const dd=dday(r.d);
  if(dd!==null){
    if(dd<0){ s-=30; why.push(`마감(${-dd}일 경과)`); }
    else if(dd<=7){ s+=15; why.push(`D-${dd} 마감임박`); }
    else { s+=8; why.push(`D-${dd}`); }
  } else if(['공고중','접수중'].includes(r.s||'')){ s+=10; why.push('공고중'); }

  return [Math.max(0,Math.min(100,s)), why];
}

const TABS=[
  ['추천',   r=>true,                                              null],
  ['마감임박', r=>{const d=dday(r.d); return d!==null&&d>=0&&d<=10;}, null],
  ['임대',   r=>r.dl.startsWith('임대'),                            null],
  ['매매·분양', r=>r.dl.startsWith('매매'),                          '매매(분양·매각)'],
  ['상가',   r=>r.dl==='상가·업무',                                 '상가·업무'],
  ['토지',   r=>r.dl==='토지',                                     '토지'],
  ['전체',   r=>true,                                              null],
];

function render(){
  if(!DATA) return;
  const days=+$('#days').value, minsc=+$('#minsc').value;
  const cut = days ? new Date(Date.now()-days*864e5).toISOString().slice(0,10) : '';
  const tabDef = TABS.find(t=>t[0]===TAB)||TABS[0];
  const tabFn = tabDef[1], allowDeal = tabDef[2];

  let rows = DATA.items.filter(r=>{
    if(cut && (r.p||'') < cut) return false;
    if(P.agency.length && !P.agency.includes(r.ag)) return false;
    if(TAB!=='전체' && r.k==='결과발표') return false;
    const dd=dday(r.d);
    if(TAB!=='전체' && dd!==null && dd<0) return false;
    return tabFn(r);
  }).map(r=>{
    const [s,w]=score(r, allowDeal);
    const j=judge(r,P), a=areaHint(r,P.minArea), res=residencyHint(r,P);
    return {...r, _s:s, _w:w, _d:dday(r.d), _j:j, _a:a, _r:res};
  }).filter(r=> !(P.hideNo && (r._j.v==='no' || (r._a&&r._a.v==='no'))) );

  if(TAB!=='전체') rows=rows.filter(r=>r._s>=minsc);
  // 소득 초과(no)만 뒤로 보내고, 나머지는 적합도순. unknown은 "불가"가 아니라 "확인 필요"다.
  const rank={ok:0,maybe:0,unknown:0,no:1};
  rows.sort((a,b)=> (rank[a._j.v]-rank[b._j.v]) || (b._s-a._s) || (b.p||'').localeCompare(a.p||''));

  $('#cnt').textContent=rows.length;
  const na=rows.filter(r=>r._d===null).length;
  $('#warnbox').style.display = na? 'block':'none';
  $('#warnbox').innerHTML = na? `SH·GH는 목록에 마감일이 없어 <b>${na}건이 마감일 미상</b>입니다. 카드를 눌러 원문에서 접수기간을 확인하세요. LH는 D-day가 정확합니다.`:'';

  if(!rows.length){ $('#list').innerHTML='<div class="empty">조건에 맞는 공고가 없습니다.<br>기간을 늘리거나 적합도 기준을 낮춰보세요.</div>'; return; }

  $('#list').innerHTML = rows.slice(0,300).map(r=>{
    let dd,cls;
    if(r._d===null){dd='마감일 미상';cls='na';}
    else if(r._d<=3){dd='D-'+r._d;cls='hot';}
    else if(r._d<=10){dd='D-'+r._d;cls='warn';}
    else {dd='D-'+r._d;cls='ok';}
    const g=r._s>=80?'a':r._s>=60?'b':r._s>=40?'c':'d';
    const isNew = LASTSEEN && (r.p||'')>LASTSEEN;
    const reg=[r.sd,r.gu].filter(Boolean).join(' ')||'지역미상';
    return `<a class="card ${r.ag}${r._j.v==='no'?' dim':''}" href="${esc(r.u)}" target="_blank" rel="noopener">
      <div class="top">
        <span class="ag ${r.ag}">${r.ag}</span>
        <span class="sc ${g}">적합 ${r._s}</span>
        ${isNew?'<span class="new">NEW</span>':''}
        <span class="vd ${r._j.v}">${({ok:'신청가능',maybe:'조건부',no:'소득초과',unknown:'확인필요'})[r._j.v]}</span>
        <span class="dd ${cls}">${dd}</span>
      </div>
      <div class="ttl">${esc(r.t)}</div>
      <div class="tags">
        <span class="tg rg">${esc(reg)}</span>
        <span class="tg">${esc(r.dl)}</span>
        ${r.ht?`<span class="tg">${esc(r.ht)}</span>`:''}
        ${(r.q||[]).map(q=>`<span class="tg ql">${esc(q)}</span>`).join('')}
      </div>
      <div class="why">${r._w.map(esc).join(' · ')}</div>
      <div class="why" style="margin-top:5px;color:var(--tx3)">자격: ${esc(r._j.msg)}${r._a?' · 면적: '+esc(r._a.msg):''}</div>
      ${r._r&&r._r.v==='warn'?`<div class="why" style="margin-top:4px;color:#8a4a00;font-weight:600">⚠ ${esc(r._r.msg)}</div>`:''}
      <div class="dts"><span>게시 ${esc(r.p||'-')}</span>${r.d?`<span>마감 ${esc(r.d)}</span>`:''}</div>
    </a>`;
  }).join('');
}

function chips(el,items,arr,onChange){
  el.innerHTML=items.map(v=>`<div class="chip${arr.includes(v)?' on':''}" data-v="${esc(v)}">${esc(v)}</div>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const v=c.dataset.v, i=arr.indexOf(v);
    if(i<0) arr.push(v); else arr.splice(i,1);
    c.classList.toggle('on'); if(onChange) onChange();
  });
}

function drawPref(){
  const el=$('#pRegions');
  el.innerHTML=P.regions.map(v=>`<div class="chip on" data-v="${esc(v)}">${esc(v)} ✕</div>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    P.regions.splice(P.regions.indexOf(c.dataset.v),1); drawPref();
  });
  chips($('#pDeals'),DEALS,P.deals);
  chips($('#pQuals'),QUALS,P.quals);
  chips($('#pAgency'),AGENCIES,P.agency);
  $('#pIncome').value = P.income ? Math.round(P.income/10000) : '';
  $('#pArea').value   = P.minArea || '';
  const dualEl=$('#pDual');
  dualEl.innerHTML=['맞벌이','외벌이'].map(v=>
    `<div class="chip${(v==='맞벌이')===!!P.dual?' on':''}" data-v="${v}">${v}</div>`).join('');
  dualEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    P.dual = c.dataset.v==='맞벌이';
    dualEl.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', (x.dataset.v==='맞벌이')===P.dual));
  });
  const hEl=$('#pHouse');
  hEl.innerHTML=[1,2,3,4,5].map(n=>
    `<div class="chip${n===+P.household?' on':''}" data-v="${n}">${n}인</div>`).join('');
  hEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    P.household=+c.dataset.v;
    hEl.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', +x.dataset.v===P.household));
  });
}

$('#tabs').innerHTML=TABS.map((t,i)=>`<div class="tab${i===0?' on':''}" data-t="${t[0]}">${t[0]}</div>`).join('');
$('#tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  $('#tabs').querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); TAB=t.dataset.t; render(); window.scrollTo(0,0);
});
$('#days').onchange=render; $('#minsc').onchange=render;
$('#btnPref').onclick=()=>{drawPref();$('#sheet').classList.add('on');};
$('#btnClose').onclick=()=>$('#sheet').classList.remove('on');
$('#btnSave').onclick=()=>{
  P.income  = (+$('#pIncome').value||0)*10000;
  P.minArea = +$('#pArea').value||0;
  localStorage.setItem('radar_pref',JSON.stringify(P));
  $('#sheet').classList.remove('on'); render();
};
$('#regAdd').onclick=()=>{
  const v=$('#regIn').value.trim().replace(/(시|군|구)$/,'');
  if(v&&!P.regions.includes(v)) P.regions.push(v);
  $('#regIn').value=''; drawPref();
};
$('#regIn').onkeydown=e=>{ if(e.key==='Enter') $('#regAdd').click(); };
$('#btnReload').onclick=()=>load(true);
$('#sheet').onclick=e=>{ if(e.target.id==='sheet') $('#sheet').classList.remove('on'); };

async function load(bust){
  try{
    // 배포 직후에도 항상 최신 데이터를 받도록 매 요청에 캐시버스터를 붙인다
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    DATA=await r.json();
    const b=(DATA.built||'').replace('T',' ').slice(0,16);
    const st=DATA.stale||{};
    const stKeys=Object.keys(st);
    // 마지막 수집이 몇 시간 전인지 계산해 신선도를 같이 보여준다
    let age='';
    try{
      const t=new Date(DATA.built);
      const h=Math.floor((Date.now()-t.getTime())/3600000);
      age = h<1 ? ' <b>(방금)</b>' : (h<24 ? ` (${h}시간 전)`
           : ` <span style="color:#a55a00">(${Math.floor(h/24)}일 전)</span>`);
    }catch(e){}
    $('#built').innerHTML=`3사 통합 <b>${DATA.count}</b>건 · 자동수집 ${b}${age}`
      + (stKeys.length?` · <span style="color:#a55a00">${stKeys.join('·')} 갱신지연</span>`:'')
      + (DATA.errors&&DATA.errors.length?` · <span style="color:#c81e1e">수집오류 ${DATA.errors.length}건</span>`:'');
    if(stKeys.length){
      const w=stKeys.map(k=>`${k} ${st[k].count}건은 ${(st[k].asof||'').replace('T',' ').slice(0,16)} 기준`).join(', ');
      const box=document.createElement('div');
      box.className='warnbox';
      
      box.innerHTML=`⚠ ${w}입니다. 해당 기관이 서버 자동수집을 차단해 직전 데이터를 그대로 보여줍니다. 최신 여부는 원문에서 확인하세요.`;
      document.querySelector('.bar').before(box);
    }
    render();
    lastFetch=Date.now();
    const newest=DATA.items.map(x=>x.p||'').sort().pop()||'';
    if(newest) localStorage.setItem('radar_seen',newest);
  }catch(e){
    $('#built').textContent='데이터를 불러오지 못했습니다: '+e.message;
    $('#list').innerHTML='<div class="empty">데이터 로드 실패.<br>네트워크를 확인하고 새로고침(&#8635;)을 눌러주세요.</div>';
  }
}
load();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ── 자동 갱신 ────────────────────────────────────────────
   서버(GitHub Actions)는 하루 3회 수집한다. 앱은 그 결과를 언제 가져오느냐가 문제다.
   ① 앱을 열 때        -> load()
   ② 앱으로 되돌아올 때 -> visibilitychange (홈 눌렀다 다시 열기 등)
   ③ 켜둔 채 방치할 때  -> 10분마다, 단 화면이 보일 때만
   ④ 네트워크 복구 시   -> online
   버튼을 누를 필요가 없다. 새로고침(↻) 버튼은 즉시 확인용으로 남겨둔다. */
lastFetch = Date.now();
const REFRESH_MS = 10*60*1000;

function autoRefresh(reason){
  if(document.visibilityState !== 'visible') return;
  if(Date.now() - lastFetch < 60*1000) return;   // 1분 내 중복 호출 방지
  lastFetch = Date.now();
  load(true);
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') autoRefresh('foreground');
});
window.addEventListener('focus', ()=>autoRefresh('focus'));
window.addEventListener('online', ()=>{ lastFetch = 0; autoRefresh('online'); });
setInterval(()=>autoRefresh('interval'), REFRESH_MS);

/* ── 앱 설치 ───────────────────────────────────────────────
   안드로이드(크롬·삼성인터넷): beforeinstallprompt 로 원터치 설치
   아이폰(사파리): 해당 이벤트가 없으므로 공유→홈 화면에 추가 안내 */
let deferred=null;
const installed = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const dismissed = localStorage.getItem('radar_ins_x')==='1';

function showInstall(mode){
  if(installed || dismissed) return;
  const box=$('#install');
  if(mode==='ios'){
    $('#insTtl').textContent='홈 화면에 추가';
    $('#insSub').innerHTML='사파리 하단 <b>공유</b> ⇧ → <b>홈 화면에 추가</b>를 누르세요';
    $('#insBtn').style.display='none';
  }
  box.classList.add('on');
}

window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferred=e; showInstall('android');
});
$('#insBtn').onclick = async ()=>{
  if(!deferred) return;
  deferred.prompt();
  const r = await deferred.userChoice;
  deferred=null;
  if(r.outcome==='accepted') $('#install').classList.remove('on');
};
$('#insX').onclick = ()=>{
  localStorage.setItem('radar_ins_x','1');
  $('#install').classList.remove('on');
};
window.addEventListener('appinstalled', ()=>$('#install').classList.remove('on'));

// iOS 사파리 판별 (beforeinstallprompt 미지원)
const ua=navigator.userAgent;
if(/iPhone|iPad|iPod/.test(ua) && /Safari/.test(ua) && !/CriOS|FxiOS/.test(ua)){
  setTimeout(()=>{ if(!deferred) showInstall('ios'); }, 1200);
}
</script>
